name: Deploy to Production

on:
  workflow_dispatch: 
  push:
    branches:
      - release/prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        id: Checkout
      - name: Install js-yaml
        run: npm install js-yaml
      - name: Extract snapshot Ids from vercode.yaml
        id: image-values
        run: |
          node -e '
            const fs = require("fs");
            const yaml = require("js-yaml");
            const fileContents = fs.readFileSync("veracode.yaml", "utf8");
            const data = yaml.load(fileContents);
            console.log(data);
            const stockroomFrontend = data.businessApplication.assets[0].name + ":" + data.businessApplication.assets[0].uuid;
            const stockroomApi = data.businessApplication.assets[1].name + ":" + data.businessApplication.assets[1].uuid;
           
            const results = [stockroomFrontend, stockroomApi];
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `results=${results.join(",")}\n`);
          ' 
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="key=stockroom/prod/terraform.tfstate" -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}"

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -var-file=terraform.tfvars
        env:
          TF_VAR_api_image_uri: ${{ secrets.ECR_REGISTRY }}/stockroom-api:9b5c28df663f7c7f9ef876fa38cbdf878bc3a432
          TF_VAR_frontend_image_uri: ${{ secrets.ECR_REGISTRY }}/stockroom-frontend:7bff82e6354b917b321053a771814d81ad5e58c5
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_api_key: ${{ secrets.API_KEY }}

      - uses: stockroom-org1/safe-to-deploy@main
        with:
          vid: ${{ secrets.VERACODE_API_ID }}
          vkey: ${{ secrets.VERACODE_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          artifacts_list: ${{ steps.image-values.outputs.results }}
          decision_mode: enforcement   # or: observer
          repository_owner: ${{ github.repository_owner }}
          repository_name: ${{ github.event.repository.name }}
          source_branch: ${{ github.head_ref }}
          pull_request: ${{ github.event.pull_request.number }}

