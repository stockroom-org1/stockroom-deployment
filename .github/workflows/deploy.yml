name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - release/prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="key=stockroom/prod/terraform.tfstate" -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}"

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -var-file=terraform.tfvars
        env:
          TF_VAR_api_image_uri: ${{ secrets.ECR_REGISTRY }}/stockroom-api:latest
          TF_VAR_frontend_image_uri: ${{ secrets.ECR_REGISTRY }}/stockroom-frontend:latest
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_api_key: ${{ secrets.API_KEY }}

      # NOTE: Veracode Repo Tools inserts a Trust Authority decision gate here.
      # Before applying, it calls POST /decisions/evaluate with the Asset Snapshot IDs
      # produced by the AST scans in each service repo's CI pipeline.
      # If Trust Authority returns "Unsafe to Ship", this workflow fails and
      # terraform apply never runs.

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve -var-file=terraform.tfvars
        env:
          TF_VAR_api_image_uri: ${{ secrets.ECR_REGISTRY }}/stockroom-api:latest
          TF_VAR_frontend_image_uri: ${{ secrets.ECR_REGISTRY }}/stockroom-frontend:latest
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_api_key: ${{ secrets.API_KEY }}
